# The single configuration file for this project: dependencies, and the config
# for ruff, mypy, pytest, coverage and import-linter. docs/wiki/stack.md §4 says
# one place, and this is it. Do not add dotfiles for these tools.

[project]
name = "mangatl"
version = "0.1.0"
description = "Local-first Japanese manga chapter translator"
requires-python = ">=3.12,<3.13"
license = "MIT"
readme = "README.md"

# Runtime dependencies are added by the story that first imports one. PySide6 is
# here because MT-001's own walking skeleton (src/mangatl/app.py, the ui test and
# the build gate) imports it. numpy, Pillow, opencv-python-headless, fonttools
# and anthropic are named in stack.md §3 and are NOT here yet: an unused
# dependency slows every `uv sync` and every PyInstaller freeze, and the sizing
# rule in MT-001 is explicit that project-specific things arrive with a failing
# test in front of them. No inference runtime is pinned at all - MT-002 decides
# ONNX Runtime versus torch+cu128 and adds it.
dependencies = [
    "PySide6>=6.8,<6.10",
    # Added by MT-004 (PO-1): `store/intake.py` decodes page scans to read their
    # pixel dimensions and to reject an undecodable scan. `Image.open()` alone is
    # not enough - it accepts a header-valid, body-corrupt PNG and reports a
    # confident size for it - so the reader calls `img.load()`. Pillow ships
    # `py.typed`, so no mypy override is needed or wanted.
    "Pillow>=11,<14",
]

[project.scripts]
mangatl = "mangatl.app:main"
# Added by MT-006 (PO-1/PO-5): the headless entry point. `mangatl` above opens
# the window and is untouched - MT-015 still owns it. Tests call
# `mangatl.cli.main([...])` in process; a test that shelled out to this name
# would be testing the installer.
mangatl-run = "mangatl.cli:main"

[dependency-groups]
# Synced by default by `uv sync`; every gate command depends on this group.
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-qt>=4.4,<5",
    "pytest-env>=1.1,<2",
    "hypothesis>=6,<7",
    "ruff>=0.12",
    "mypy>=1.11,<2",
    "import-linter>=2,<3",
    "pyinstaller>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mangatl"]

# --- ruff: linter AND formatter ---------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# MEASURED 2026-09-12, ruff 0.16.7: `ruff format .` reported **115 files**, not
# 17. ruff now formats Python code blocks inside **Markdown**, and 98 of those
# were `.claude/**/*.md` and `docs/**/*.md` - the vendored harness and the wiki.
# Left alone, `uv run ruff format .` rewrites harness documentation, which
# check-boundaries.sh refuses without a VERSION bump, and the `format` gate
# starts failing on prose nobody in this project owns. Scope ruff to this
# project's own code, and keep Markdown out of it entirely so the count is
# stable. See MT-001 PO-4.
extend-exclude = [".claude", "docs", "fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# MEASURED 2026-09-15 (MT-005 PO-9, and again in GREEN before this line was
# written): ruff's first-party detection is a question about the FILESYSTEM, so
# `mangatl.store.project` reads as third-party for exactly as long as
# `src/mangatl/store/project.py` does not exist. A test written in RED against a
# module GREEN has not created yet therefore gets I001 demanding its `mangatl.*`
# imports be split into a separate block - and the demand REVERSES the moment
# the module lands, so no single import layout is clean in both phases. Tests
# are frozen in GREEN and in GATES, so the reflow is illegal in the only phases
# that could notice. Naming the package here makes the classification a fact of
# the config instead of a fact of the working tree. MT-004 paid for this with a
# return to RED; MT-005 paid one config line.
#
# It cannot mask real disorder: the setting decides which BLOCK a name belongs
# in, not whether the blocks are sorted. Probed in MT-005 `## Gate probes` by
# scrambling a real first-party import block, which still fails I001 under it.
known-first-party = ["mangatl"]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use bare asserts; neither is a production smell.
"tests/**" = ["B011"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["mangatl"]
strict = true
warn_unreachable = true

# PySide6 ships partial stubs; its dynamic Qt metaobject layer is not typed to
# mypy's satisfaction and never will be. Narrow to the third-party package,
# never to our own code.
[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "gpu: needs a real GPU and real .onnx weights; never runs on CI",
    "network: calls a paid API over the network; never runs on CI",
]
# Set here and not only in the gate command, so that an agent typing
# `uv run pytest` by hand gets the same behaviour as the gate. stack.md §7.
env = [
    "QT_QPA_PLATFORM=offscreen",
]

# --- coverage ----------------------------------------------------------------
# The thresholds live in the GATE COMMANDS (--cov-fail-under), not here, so the
# number is visible where it is enforced. MT-001 contract.
[tool.coverage.run]
branch = true
source = ["src/mangatl"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    # The console-script guard. It is one line of dispatch with no behaviour of
    # its own; `mangatl.app:main` is what the entry point and the tests call.
    "if __name__ == .__main__.:",
]

# --- import-linter -----------------------------------------------------------
# The five contracts of architecture.md §3, written by MT-003. The `lint` gate
# runs `lint-imports` and its evidence line is `Contracts: [1-9][0-9]* kept`,
# floored at 5 in .claude/harness/project.conf - so a contract quietly
# disappearing fails the gate rather than passing it silently.
#
# `include_external_packages` is mandatory: contracts 2, 4 and 5 forbid external
# modules, and without it import-linter raises rather than reporting a vacuous
# `kept` (MT-003 P1/P10).
[tool.importlinter]
root_packages = ["mangatl"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Imports go down the layers only"
type = "layers"
# The six stage packages are INDEPENDENT siblings - `|`, not `:`. `pipeline` is
# the orchestrator; a stage importing a stage would make that a fiction, would
# leak the onnxruntime confinement below transitively, and would put a stage in
# the 100%-coverage set of `coverage-core`. MT-003 P8, architecture.md §3.
layers = [
    "mangatl.ui",
    "mangatl.pipeline",
    "mangatl.detect | mangatl.ocr | mangatl.translate | mangatl.clean | mangatl.typeset | mangatl.bench",
    "mangatl.store",
    "mangatl.domain",
]

[[tool.importlinter.contracts]]
name = "domain is independent"
type = "forbidden"
source_modules = ["mangatl.domain"]
# `mangatl.*` is what §3 literally says - "nothing else of ours" - and it covers
# a package a future story adds. MT-003 P9.
forbidden_modules = [
    "mangatl.*",
    "numpy",
    "PIL",
    "PySide6",
    "onnxruntime",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "Nothing imports ui"
type = "forbidden"
# `mangatl.app` is deliberately absent: the entry point's whole job is to open
# the window, and a contract forbidding that breaks `scripts/task.sh dev`.
# "Nothing imports ui" means nothing BELOW the entry point. MT-003 P2.
# `mangatl.cli` is the opposite kind of entry point and belongs here: MT-006's
# AC-9/AC-10 make it headless, and this contract is what turns that from a claim
# a test makes into a fact the `lint` gate checks (MT-006 PO-5).
source_modules = [
    "mangatl.cli",
    "mangatl.domain",
    "mangatl.store",
    "mangatl.detect",
    "mangatl.ocr",
    "mangatl.translate",
    "mangatl.clean",
    "mangatl.typeset",
    "mangatl.pipeline",
    "mangatl.bench",
]
forbidden_modules = ["mangatl.ui"]

[[tool.importlinter.contracts]]
name = "Only translate imports anthropic"
type = "forbidden"
source_modules = [
    "mangatl.app",
    "mangatl.cli",
    "mangatl.domain",
    "mangatl.store",
    "mangatl.detect",
    "mangatl.ocr",
    "mangatl.clean",
    "mangatl.typeset",
    "mangatl.pipeline",
    "mangatl.bench",
    "mangatl.ui",
]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Only detect, ocr and clean import onnxruntime"
type = "forbidden"
source_modules = [
    "mangatl.app",
    "mangatl.cli",
    "mangatl.domain",
    "mangatl.store",
    "mangatl.translate",
    "mangatl.typeset",
    "mangatl.pipeline",
    "mangatl.bench",
    "mangatl.ui",
]
forbidden_modules = ["onnxruntime"]
