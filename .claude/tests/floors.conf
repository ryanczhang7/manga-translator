# Assertion floors for the harness's own suites.
#
#   <kind> | <suite> | <value>
#
# Read by scripts/selftest.sh, and by nothing else. The grammar is
# project.conf's on purpose, so that it is one vocabulary and not two:
# `#` comments and blank lines are ignored, fields are `|`-separated, and
# leading and trailing space is trimmed.
#
# THE VALUE IS THE EXECUTED ASSERTION COUNT, not the number of `assert_` call
# sites in the suite source. It is the `N` of summary()'s `<name>: N passed,
# M failed` line - read it off `bash scripts/selftest.sh <suite>`, never off
# `grep -c assert_`. The two disagree for most suites and wildly for some:
# `profiles` is ONE call site inside a loop and THIRTY-SEVEN executed
# assertions, and a floor of 1 would be satisfied by deleting 36 of them.
# `lib` is 50 call sites and 139 executed.
#
# It is a FLOOR, not an equality. A story that ADDS assertions to a suite need
# not touch this file; a story that removes them must, and must say why.
# Every suite in .claude/tests must appear here or the full run fails: a suite
# with no floor is a suite that can be emptied.
#
# THIS FILE IS UPSTREAM'S, and a refresh replaces it. A consuming project's own
# suites (`project-*.test.sh`) declare their floors in
# .claude/tests/project-floors.conf instead - same grammar, read after this
# file and only if it exists. Upstream never ships that file, so the refresh
# keeps it. A suite floored in both files fails the full run (HARNESS-020).
#
# The values below were measured from a full run of this repository at the
# commit that introduced this file, and confirmed against the CI run of the
# same tree. Raise one deliberately; never lower one to make a run pass.

# A FLOOR IS RECORDED TWICE. `.claude/tests/selftest.test.sh` carries a
# hand-copied table of these same numbers, so that a floor silently lowered
# to make a run pass is caught by a suite rather than by a reviewer. Raise
# one here and you MUST raise it there in the same commit, or the `selftest`
# suite fails with `and each records the executed count measured on this
# tree`. HARNESS-011 found that out the way everyone finds it out: on CI.
floor | boundaries    | 113
floor | ci-local      | 28
floor | classify      | 55
floor | doctor        | 50
floor | gate-reminder | 32
floor | gates         | 470
floor | grep-count    | 20
floor | lib           | 217
floor | mutate        | 189
floor | new-story     | 43
floor | phase         | 33
floor | phase-guard   | 310
floor | plan          | 42
floor | policy        | 17
floor | procedure     | 37
floor | profiles      | 50
floor | refresh       | 122
floor | reporting     | 27
floor | run-lock      | 140
floor | settings      | 27
floor | sigpipe       | 82
floor | spawns        | 69
floor | worktree      | 73
floor | selftest      | 268

