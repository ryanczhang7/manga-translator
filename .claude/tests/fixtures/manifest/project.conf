# HARNESS-024's synthetic manifest. UPSTREAM-OWNED: this is not any project's
# real project.conf, and no assertion may read a value out of the real one.
# Every line shape gates.sh, doctor.sh and task.sh distinguish appears below at
# least once. Every gate and task command is a printf, `true` or a builtin, so
# the goldens beside this file are the same on every machine; the one
# exception, no-such-tool-h024, is never executed (its gate is ondemand) and
# exists so doctor.sh has an executable to report MISSING.
BOOTSTRAPPED= yes 

	# a tab-indented comment
   
	
# gate | broken | required | . | printf 'boom\n'; exit 1
 	 # floor | unit | 900
this line has no pipe at all
colour    | unit     | blue
gate      | short

# --- gates -----------------------------------------------------------------
gate	|	unit	|	required	|	.	|	printf 'Tests  47 passed (47)\n'	
gate      | lint     | required |     | printf 'Checked 5 files|ok\n' | while IFS= read -r l; do printf '%s\n' "$l"; done || exit 1
gate      | types    | required | .   | true
gate      | coverage | optional | src | printf 'Coverage 91%% of 12 files\n'
gate      | e2e      | optional | .   | printf 'RuntimeError: no device here\n'; exit 1
gate      | docs     | optional | .   |
gate      | mutation | optional | .   | no-such-tool-h024 run --all

# --- evidence ----------------------------------------------------------------
evidence  | unit     | Tests +[1-9][0-9]* passed|Checks [0-9]+ ok
evidence  | lint     | Checked [1-9][0-9]* files
evidence  | types    | -
evidence  | coverage | Coverage [0-9]+% of [1-9][0-9]* files
evidence  | e2e      | Tests +[0-9]+ passed
evidence  | mutation | -

# --- waiver, floor, slow, ondemand -----------------------------------------
waiver    | docs     | docs build needs a renderer this machine lacks | issue 12
floor     | unit     | 40
floor     | lint     | 3
slow      | coverage | instrumented | about 3x the plain run
ondemand  | mutation | minutes per mutant | run with --gate mutation

# --- ci-factor ---------------------------------------------------------------
ci-factor | unit     | 3.4 | actions run 412
ci-factor | lint     | 1.5 | actions run 412 | lint job | step 3
ci-factor | coverage | 2.5 |  | measured in actions run 413

# --- covers, blocked-when ----------------------------------------------------
covers    | unit     | src/**
covers    | unit     | tests/**
blocked-when | e2e   | alpha launch failed|beta refused to start|no device here

# --- discovery ---------------------------------------------------------------
discovery | cpu      |     | printf 'CUDA|CPU\n' | { IFS= read -r l; case "$l" in *'|CPU') true ;; *) false ;; esac; }
discovery | gpu      | src | printf 'CUDA|Dml\n' | { IFS= read -r l; case "$l" in *'|CPU') true ;; *) false ;; esac; }

# --- tasks -------------------------------------------------------------------
task      | pipes    | - | .   | printf 'a|b\n' | while IFS= read -r l; do printf '[%s]\n' "$l"; done; printf 'args:%s\n'
task	|	where	|	-	|	src	|	printf 'in %s\n' "${PWD##*/}"; printf 'arg=%s\n'
task      | idle     | - | .   |
