# HARNESS-024's synthetic BROKEN manifest: one of each failure `gates.sh
# --audit` can report, so its golden pins every audit failure path and its rc.
# Upstream-owned and synthetic, like project.conf beside it.
BOOTSTRAPPED=yes

gate      | ok       | required | . | printf 'Tests  9 passed (9)\n'
gate      | nan      | required | . | printf 'Tests  9 passed (9)\n'
gate      | blind    | required | . | printf 'Tests  9 passed (9)\n'
gate      | hush     | optional | . | printf 'Tests  9 passed (9)\n'
gate      | idle     | optional | . | printf 'Tests  9 passed (9)\n'
gate      | needed   | required | . | printf 'Tests  9 passed (9)\n'
gate      | guess    | optional | . | printf 'Tests  9 passed (9)\n'
gate      | anon     | optional | . | printf 'Tests  9 passed (9)\n'
gate      | nowhere  | optional | missing-dir | printf 'Tests  9 passed (9)\n'
gate      | bare     | required | . | printf 'done\n'
gate      | bypass   | required | . | printf 'Tests  9 passed (9)\n'
gate      | empty    | required | . |

evidence  | ok       | Tests +[1-9][0-9]* passed
evidence  | nan      | Tests +[1-9][0-9]* passed
evidence  | hush     | Tests +[1-9][0-9]* passed
evidence  | idle     | Tests +[1-9][0-9]* passed
evidence  | needed   | Tests +[1-9][0-9]* passed
evidence  | guess    | Tests +[1-9][0-9]* passed
evidence  | anon     | Tests +[1-9][0-9]* passed
evidence  | bypass   | Tests +[1-9][0-9]* passed

# a non-numeric floor, and a floor with no evidence to measure
floor     | nan      | forty
floor     | blind    | 5
# slow with no reason, and slow naming no gate
slow      | hush     |
slow      | ghost    | it is slow | very
# ondemand with no reason, and ondemand on a required gate
ondemand  | idle     |
ondemand  | needed   | costly | per mutant
# a ci-factor that is not a number, and one with no source
ci-factor | guess    | about 3 | actions run 1
ci-factor | anon     | 2.0
# an orphan blocked-when, and an empty pattern
blocked-when | phantom | refused|denied
blocked-when | ok      |
# an orphan covers, and an empty glob
covers    | phantom  | src/**
covers    | ok       |
# a cwd that does not exist (on request, so a full run never cd's into it and
# prints a machine-specific path), and a required gate with no evidence line
ondemand  | nowhere  | needs a directory | that is missing
# a waiver on a required gate
waiver    | bypass   | known to fail | issue 3
