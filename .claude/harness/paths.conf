# Path classification for the phase guard.
#
# Format:  <category> | <glob>
# Categories: vendor | harness | docs | test | config | source
#
# A path is classified by the FIRST matching rule, top to bottom.
#
# A path that matches nothing is put to `git check-ignore`, and classified
# "ignored" if the project ignores it - a test runner's scratch directory, a
# report, a build artefact. That is what keeps `rm -rf .vitest` from being read
# as deleting source, without a new rule here for every tool that invents a
# dot-directory. Only a path git neither tracks nor ignores falls through to
# "source", which is the right default for a file about to be authored.
# `ignored` is writable in every phase; see phases.conf.
#
# Globs: ** matches any number of path segments, * matches within one segment.
# Paths are matched relative to the repository root, using forward slashes.
#
# BOTH FORMS, ALWAYS. A glob written `x/**` matches paths UNDER x and never x
# itself. So the classifier retries: a bare path that matches NO rule is judged
# again with one trailing `/`, and takes the category of the first rule that
# matches that form, with that rule's anchoring (`fixtures/**` covers bare
# `fixtures`, never `lib/fixtures`; `**/tests/**` covers any bare `tests`).
# So `x/**` covers `x`, and a new rule - a project's own especially - needs no
# bare twin (HARNESS-031, after manga-translator MT-034).
#
# The bare twins below predate the retry (HARNESS-011, when `rm -rf tests` was
# writable in the phases that freeze tests) and are kept: each has the SAME
# anchoring as its `/**` partner, so the retry gives the same answer.
#
# A bare rule still wins over the retry, because the retry fires only when no
# rule matched the bare form. So write a bare rule only to give a directory a
# DIFFERENT category from its contents, and put it where the FIRST matching
# rule wins.
#
# The bare form also matches a FILE of that name. That is accepted, not an
# oversight: the classifier sees a string rather than an inode, and is asked
# about paths that do not exist yet.
#
# Edit the `test` and `config` sections during the bootstrap story so they
# describe your actual stack. Leave `harness` and `docs` alone.

# --- Vendor: installed or generated, never authored -------------------------
# Must come FIRST: node_modules contains .md and *.test.js files that would
# otherwise be classified as docs or tests. Writable in every phase, because
# installing dependencies is never a phase violation.
vendor | **/node_modules/**
vendor | **/.venv/**
vendor | **/venv/**
vendor | **/__pycache__/**
vendor | **/.pytest_cache/**
vendor | **/.mypy_cache/**
vendor | **/.ruff_cache/**
vendor | **/.tox/**
vendor | target/**
vendor | **/dist/**
vendor | **/build/**
vendor | **/out/**
vendor | **/.next/**
vendor | **/.svelte-kit/**
vendor | **/.turbo/**
vendor | **/coverage/**
vendor | **/htmlcov/**
vendor | **/vendor/**
vendor | addons/**
vendor | .godot/**

# The directories themselves - see BOTH FORMS at the top of this file.
vendor | **/node_modules
vendor | **/.venv
vendor | **/venv
vendor | **/__pycache__
vendor | target
vendor | **/dist
vendor | **/build
vendor | **/out
vendor | **/coverage
vendor | **/htmlcov
vendor | **/vendor
vendor | addons
vendor | .godot

# --- Harness: agentic tooling, never ships to production images -------------
harness | .claude/**
harness | scripts/**
harness | .github/**
# The directories themselves - see BOTH FORMS at the top of this file.
harness | .claude
harness | scripts
harness | .github
harness | CLAUDE.md
harness | .gitignore
# Repository metadata: not documents, not production code, and no gate
# reads them. They classify as harness for the same reason .gitignore does -
# whoever needs one adds it in the phase they need it, and freezing them
# serves nothing. .gitattributes in particular can change what every gate
# SEES, by deciding line endings, so it belongs with the gated harness files
# rather than with the docs.
harness | .gitattributes
harness | .editorconfig
harness | .mailmap
harness | CODEOWNERS

# --- Docs: the wiki and the backlog ----------------------------------------
docs | docs/**
# The directory itself - see BOTH FORMS at the top of this file.
docs | docs
docs | README.md
# The licence and the repository's standing notices. Extensionless, so they
# fell through every rule here to the SOURCE fallback - which made a
# licence-only change a PR that check-boundaries.sh refused for shipping
# production code with no tests, and made LICENSE unwritable in RED and
# REVIEW. They are documents; classify them as such.
docs | LICENSE
docs | LICENSE.*
docs | COPYING
docs | COPYING.*
docs | NOTICE
docs | NOTICE.*
docs | AUTHORS
docs | CONTRIBUTORS
docs | **/*.md

# --- Tests: written during RED, frozen during GREEN ------------------------
test | **/tests/**
test | **/test/**
test | **/__tests__/**
test | **/spec/**
# The directories themselves - see BOTH FORMS at the top of this file.
test | **/tests
test | **/test
test | **/__tests__
test | **/spec
test | **/test_*.*
test | **/*_test.*
test | **/*.test.*
test | **/*.spec.*
test | **/*Test.*
test | **/*Tests.*
test | **/conftest.py
# Probe artifacts. A guard that tests a lint RULE - rather than whatever the
# code happens to import today - has to write a deliberately offending module
# and run the real linter over it, and that module must live under the REAL
# path, because lint overrides are path-scoped: a probe linted from a temp
# directory is linted under the wrong rules and the guard silently stops
# testing anything while still passing.
#
# So probes sit in the source tree, and every tree-scanning guard has to skip
# them. One rule here is what lets the scanner and the phase lock agree: the
# alternative is each guard carrying a private regex, which is how four copies
# in one project drifted apart and spent six stories returning probes as
# production source - asserting properties over files written to violate a
# rule, and passing only because it was a different rule.
#
# The leading __ is load-bearing. Matching *_probe.* would make a real module
# named heat_probe.ts invisible to every guard, which is the same defect
# pointing the other way.
test | **/__probe_*.*
test | **/__*_probe.*
test | **/jest.config.*
test | **/vitest.config.*
test | **/playwright.config.*
test | **/pytest.ini

# --- Config: build/dep/runtime configuration, owned by Feature Developer ---
# Dependency manifests are their OWN category, split out of config, because a
# failing test routinely needs a test-only dependency - a temp-directory crate,
# an async pytest plugin, a snapshot matcher - and every ecosystem declares that
# in the same file as the production dependencies. Frozen as config, RED could
# not say what its tests needed, while GREEN could add anything at all: the
# phase forbidden from touching production code was the only one that could not
# declare a test dependency.
#
# Only files with an in-file dev/production split belong here, plus the
# lockfiles that change when one is installed - otherwise the install cannot
# complete. go.mod, requirements.txt and *.csproj have no such split, so they
# stay config and a RED phase needing a test dependency there takes the
# documented excursion in tdd-cycle instead.
#
# What RED may put in them is not decided here. check-boundaries.sh reads the
# diff of every RED commit and refuses one that touched anything outside the
# dev-dependency block.
manifest | package.json
manifest | package-lock.json
manifest | pnpm-lock.yaml
manifest | pyproject.toml
manifest | uv.lock
manifest | Cargo.toml
manifest | Cargo.lock
config | requirements*.txt
config | go.mod
config | go.sum
config | *.csproj
config | project.godot
config | export_presets.cfg
config | Dockerfile*
config | docker-compose*.yml
config | .dockerignore
config | tsconfig*.json
config | vite.config.*
config | next.config.*
config | tailwind.config.*
config | Makefile
config | justfile

# --- This project's own rules (manga-translator) -----------------------------
# Kept by hand across harness refreshes: upstream's rules above are the base and
# win on any overlap; these are appended. (Merged at the release-81 refresh.
# `pyproject.toml`, `uv.lock` and the other dependency manifests were `config`
# here before; upstream now classifies them `manifest`, and upstream wins.)
#
# `fixtures/**` classifies as `test` even though it is data rather than code:
# page scans and hand-made ground-truth annotations. RED must be able to author
# a fixture to write a test against, and GREEN must not be able to touch one -
# a fixture quietly adjusted to make a test pass is the same move as editing the
# test, and the phase lock is the only thing that would notice. Bare `fixtures`
# needs no twin: classify() retries a bare path with a trailing `/` (HARNESS-031).
test | fixtures/**

# The PyInstaller spec and the model manifest are build configuration, and the
# Inno Setup script likewise (docs/wiki/stack.md §4). Note what is deliberately
# NOT here: src/mangatl/ui/theme.qss and src/mangatl/ui/tokens_gen.py are
# generated by MT-025 but are committed and read by the shipped app, so they
# fall through to `source` - which is correct, because regenerating them is a
# GREEN-phase act and editing them by hand is what MT-025's AC-5 exists to catch.
config | packaging/*.spec
config | packaging/*.iss
config | packaging/models.json
config | .python-version

# Everything else falls through to: source
