# Phase -> allowed write categories, enforced by .claude/hooks/phase-guard.sh
#
# Format:  <PHASE> | <comma-separated categories> | <message shown on denial>
#
# When no story is active (no .claude/state/current-story.env), the guard is
# OFF entirely — ad-hoc work is never blocked. The lock exists to protect the
# RED -> GREEN discipline while a story is genuinely in flight.
#
# `vendor` and `ignored` appear in every phase on purpose. Installed
# dependencies and anything the project's .gitignore covers are generated, not
# authored, so writing or deleting them is never a phase violation.

IDLE     | vendor,ignored,test,source,config,docs,harness | No active story; all writes allowed.
PLANNED  | vendor,ignored,docs,harness             | Story is still being planned. Only the backlog and wiki may change. Move to RED with: bash scripts/phase.sh set <id> RED
RED      | vendor,ignored,test,docs,harness        | Story is in RED. Production code is frozen: write the failing test first, and let it fail for the right reason. Move to GREEN with: bash scripts/phase.sh set <id> GREEN
GREEN    | vendor,ignored,source,config,docs,harness | Story is in GREEN. Tests are frozen: make the existing failing tests pass without changing them. If the tests are genuinely wrong, go back to RED rather than editing them here.
GATES    | vendor,ignored,source,config,docs,harness | Story is in GATES. Tests are frozen: fix lint/type/build failures in production code. If a gate failure means a test is wrong, return to RED.
REVIEW   | vendor,ignored,docs,harness             | Story is in REVIEW awaiting PR feedback. Only docs and backlog may change. Return to GREEN or GATES to make code changes.
SCAFFOLD | vendor,ignored,test,source,config,docs,harness | Bootstrap/chore story: scaffolding is unlocked by design. Nothing here forces a test to exist first, so name every production file you write in the story's ## Scaffold inventory, with the test that covers it. check-boundaries.sh refuses the PR otherwise.
DONE     | vendor,ignored,docs,harness             | Story is DONE. Start a new story rather than editing code under a closed one.
