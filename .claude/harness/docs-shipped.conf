# What the harness ships under docs/, and what it never may.
#
#   <kind> | <path>
#
# Read by scripts/refresh-harness.sh (the `ship` lines) and by
# .claude/tests/shipped-docs.test.sh (both kinds). The grammar is
# project.conf's and floors.conf's on purpose, so that it is one vocabulary:
# `#` comments and blank lines are ignored, fields are `|`-separated, and
# leading and trailing space is trimmed. One repository-relative path per line.
#
# Two kinds, and the line between them is drawn here rather than inferred:
#
#   ship     a file the harness ships verbatim under docs/ that a command,
#            agent or skill tells an agent to read or copy - a template, never
#            a page an agent fills in. The refresh ADDS it to a project that has
#            no copy, and never overwrites one the project has.
#   written  a path the project's own agents produce (/create-product,
#            /plan-product, /setup-environment, the Lead Designer,
#            new-story.sh). The refresh never creates it, and the rule never
#            demands it. An entry ending in `/` is a directory and covers
#            everything beneath it.
#
# Every literal docs/ path in .claude/commands, .claude/agents and
# .claude/skills must be on one of the two lists; `bash scripts/selftest.sh
# shipped-docs` fails naming the file and the path otherwise. So the next
# template cannot be named by a command without being delivered.
#
# The design pages are listed as files, not as docs/wiki/design/, so that a
# template later dropped into that directory is NOT covered and the rule fires.
# The two backlog directories are the only directory entries, because
# new-story.sh writes there; a template placed under either is invisible to the
# rule, which is its written limit. Never add `written | docs/wiki/audits/`: it
# would contradict the TEMPLATE ship line, and the suite says so.
#
# Considered and left off: docs/wiki/README.md and docs/backlog/README.md are
# shipped verbatim too, but nothing instructs an agent to read them and every
# consumer has both from its first vendoring. One `ship` line each, if wanted.

ship    | docs/wiki/audits/TEMPLATE.md

written | docs/wiki/product-brief.md
written | docs/wiki/stack.md
written | docs/wiki/architecture.md
written | docs/wiki/environment.md
written | docs/wiki/design/tokens.md
written | docs/wiki/design/components.md
written | docs/wiki/design/layout.md
written | docs/wiki/design/accessibility.md
written | docs/wiki/design/voice.md
written | docs/backlog/epics/
written | docs/backlog/stories/
