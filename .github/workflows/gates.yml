name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    # windows-latest, not ubuntu-latest. Decided by the user on 2026-09-12 and
    # recorded as PO-3 in docs/backlog/stories/MT-001.md: the `build` gate is
    # PyInstaller, and on Linux it would freeze an ELF - a required gate
    # verifying an artefact this product never ships. docs/wiki/stack.md §7 (the
    # Microsoft Store Python alias) is also only exercised on the platform it
    # describes. Costs 2x GitHub minutes; accepted.
    runs-on: windows-latest

    defaults:
      run:
        # Every harness script is bash. Without this the runner would use pwsh
        # and each step would have to spell out `bash ...` anyway.
        shell: bash

    env:
      # Every gate command begins `uv run`, which installs the locked
      # environment on first use - so there is deliberately NO separate
      # `uv sync` step. That is not laziness: `.claude/tests/ci-local.test.sh`
      # derives ci-local.sh's step list from the `run:` lines in this file, and
      # a project-level install step there would run inside the bare fixtures
      # the harness self-test builds. Keeping the workflow to harness scripts
      # keeps that check honest.
      #
      # UV_FROZEN is what a `uv sync --frozen` step would have bought, and more:
      # it applies to EVERY `uv run` in the job, so a `uv.lock` that does not
      # match `pyproject.toml` fails here instead of being silently re-resolved
      # on the runner.
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v5

      # The interpreter comes from `.python-version` and uv.lock, not from a
      # setup-python step: uv manages the interpreter as well as the venv, which
      # is the whole reason the stack chose it (stack.md §3).
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The harness's own tests. They need nothing but bash and git, and they
      # guard the machinery every other check in this workflow depends on: the
      # phase lock, the path classifier, the quote-aware command parsing.
      - name: Harness self-test
        run: bash scripts/selftest.sh

      # Two harness guards (from agentic-dev-harness release 81; doctor.sh asks
      # for both). A pipefail matcher that a closed pipe can turn into 141, and a
      # `grep -c` fallback that prints a second value: both report the opposite
      # of the truth while every process exits cleanly. The first is a race on
      # the pipe buffer, so the run that matters is this one, on the runner.
      # Bash and git only, like the self-test.
      - name: Refuse pipefail SIGPIPE matchers
        run: bash scripts/check-sigpipe.sh

      - name: Refuse a printing grep -c fallback
        run: bash scripts/check-grep-count.sh

      - name: Show configured gates
        run: bash scripts/gates.sh --list

      # Catches a gate whose command was emptied, whose cwd was moved away, or
      # whose evidence line was dropped - none of which the gate run itself can
      # report, because a gate that no longer does anything still exits 0.
      - name: Audit the gate manifest
        run: bash scripts/gates.sh --audit

      - name: Run gates
        run: bash scripts/gates.sh

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs
          path: .claude/state/gate-logs/
          if-no-files-found: ignore
